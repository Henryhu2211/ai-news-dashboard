name: Daily AI News Update

on:
  schedule:
    # 每天 UTC 20:00 = NZT 次日 08:00
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run News Fetcher
        run: node scripts/update-news.js

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Use GITHUB_TOKEN for push
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git add data/latest.json
          git diff --quiet && echo "NO_CHANGES" || git commit -m "📰 Auto-update AI news $(date +'%Y-%m-%d')" && git push
