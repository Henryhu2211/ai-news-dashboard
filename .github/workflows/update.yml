name: Daily AI News Update

on:
  schedule:
    # 每天 UTC 20:00 = NZT 次日 08:00
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run News Fetcher
        run: node scripts/update-news.js

      - name: Always update timestamp to force a commit
        run: |
          date_str=$(date +'%Y-%m-%d %H:%M UTC')
          sed -i "s|<p>每日 8 点自动更新.*</p>|<p>每日 8 点自动更新 | 最后更新: ${date_str}</p>|g" index.html

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git add data/latest.json index.html
          git commit -m "📰 Auto-update AI news $(date +'%Y-%m-%d')" && git push || echo "Push skipped (no changes)"

  deploy:
    needs: update-news
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0  # 获取最新代码（包含刚 push 的内容）

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
